name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: dc02bae6c57f5ac25d870cab7cdf2b0b
      VITE_MEDIA_BASE_URL: https://media.avinashpatel.in

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not available to this workflow. Add it as a repository Actions secret."
            exit 1
          fi

          verify_response="$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [[ "$(jq -r '.success // false' <<<"${verify_response}")" != "true" ]]; then
            error_message="$(jq -r '[.errors[]?.message] | join("; ")' <<<"${verify_response}")"
            echo "::error::Cloudflare API token verification failed: ${error_message:-unknown error}"
            exit 1
          fi

          project_response="$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/avinashpatel-portfolio")"
          if [[ "$(jq -r '.success // false' <<<"${project_response}")" != "true" ]]; then
            error_message="$(jq -r '[.errors[]?.message] | join("; ")' <<<"${project_response}")"
            echo "::error::Token cannot access the Cloudflare Pages project: ${error_message:-unknown error}"
            exit 1
          fi

          echo "Cloudflare token is active and can access avinashpatel-portfolio."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.135.0"
          command: pages deploy dist --project-name=avinashpatel-portfolio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
